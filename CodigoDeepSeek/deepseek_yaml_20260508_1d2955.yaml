version: '3.8'

services:
  auth-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://auth_user:securepassword@postgres:5432/auth_db
      - SECRET_KEY=your-256-bit-secret-key-must-be-at-least-32-chars-long-change-in-production
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - auth-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=auth_user
      - POSTGRES_PASSWORD=securepassword
      - POSTGRES_DB=auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - auth-network

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - auth-network

volumes:
  postgres_data:

networks:
  auth-network:
    driver: bridge